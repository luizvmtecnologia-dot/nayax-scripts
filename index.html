const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = new TextEncoder();
async function sha256hex(t){
  const d = await crypto.subtle.digest('SHA-256', enc.encode(t));
  return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2,'0')).join('');
}
async function unlock(email, pw){
  const h = await sha256hex(email);
  const u = P.u.find(x => x.h === h);
  if(!u) throw new Error('bad');
  const base = await crypto.subtle.importKey('raw', enc.encode(email + ':' + pw), 'PBKDF2', false, ['deriveKey']);
  const kek = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(u.s), iterations:P.it, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const raw = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(u.i)}, kek, b64(u.k));
  const dk = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, dk, b64(P.ct));
  const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('b'), err = document.getElementById('e');
  const email = document.getElementById('u').value.trim().toLowerCase();
  const pw = document.getElementById('p').value;
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Verificando...';
  try{
    const html = await unlock(email, pw);
    document.open(); document.write(html); document.close();
  }catch(e){
    await new Promise(r => setTimeout(r, 1200));
    err.textContent = 'E-mail ou senha inválidos.';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});
