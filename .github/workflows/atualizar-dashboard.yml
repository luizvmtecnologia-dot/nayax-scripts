name: Atualizar dashboard Nestlé
on:
  schedule:
    - cron: "30 12 * * 1-5"   # 09:30 Brasília (UTC-3), seg a sex
  workflow_dispatch: {}        # permite rodar manualmente
permissions:
  contents: write
concurrency: dashboard-nestle
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Gerar index.html (histórico do repo + últimos 120 dias do Zendesk)
        env:
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_TOKEN: ${{ secrets.ZENDESK_TOKEN }}
        run: python gerar_dashboard.py index.html index.html
      - name: Commit e push
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Atualiza dashboard Nestlé $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')" && git push)
